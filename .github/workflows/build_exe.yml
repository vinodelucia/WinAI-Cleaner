name: Test, Build & Release Windows Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_build:
    runs-on: windows-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências e Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: |
          python -m ruff check . --select E,F,W --ignore E501

      - name: Executar Testes Unitários com Cobertura (Quality Gate)
        run: |
          python -m pytest -v --cov=src --cov-report=term

      - name: Gerar Ícone Nativo (.ico)
        run: |
          python -c "from src.icon_helper import ensure_app_icon; ensure_app_icon()"

      - name: Compilar Executável Portátil com Ícone Embutido (PyInstaller)
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon=assets/icon.ico --add-data "assets/icon.ico;assets" --name "WinAI-Cleaner" main.py

      - name: Gerar Hash SHA-256 do Executável
        shell: pwsh
        run: |
          (Get-FileHash dist/WinAI-Cleaner.exe -Algorithm SHA256).Hash.ToLower() + '  WinAI-Cleaner.exe' | Out-File -Encoding ascii dist/WinAI-Cleaner.exe.sha256

      - name: Upload do Artefato de Build (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: WinAI-Cleaner-Portable
          path: |
            dist/WinAI-Cleaner.exe
            dist/WinAI-Cleaner.exe.sha256

      - name: Criar Release Pública no GitHub (Quando subir uma Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinAI-Cleaner.exe
            dist/WinAI-Cleaner.exe.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
